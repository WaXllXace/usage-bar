[package]
name = "claude-personal-usage"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-personal-usage"
path = "src/main.rs"

[dependencies]
tao = "0.30"
tray-icon = "0.19"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
